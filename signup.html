<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body{
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container{
            width: 350px;
            background-color:bisque;
            padding: 25px;
        }
        .form-group{
            margin-bottom: 15px;

        }
        .formss{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    
    </style>
</head>
<body>

    <div class="form-container">
    <h2 style="text-align: center; margin-bottom: 20px;">Registration Form</h2><br>    
    <form action="">
        <div class="form-group">
        <div class="formss">
        <label style="background-color: aquamarine; border-radius: 6px; padding: 8px 12px;">Name:</label>
        <input type="text" placeholder="Enter your name" required>
        </div>
        </div>
        <div class="form-group">
            <div class="formss">
        <label style="background-color: aquamarine; border-radius: 6px; padding: 8px 12px;" for="">Email:</label>
        <input type="text" placeholder="Enter your email" required>
        </div>
        </div>
        <div class="form-group">
            <div class="formss">
        <label style="background-color: aquamarine; border-radius: 6px; padding: 8px 12px;"for="">Password:</label>
        <input type="password" placeholder="Enter password" required>
        </div>
        </div>
        <div class="form-group">
            <div class="formss">
        <label style="background-color: aquamarine; border-radius: 6px; padding: 8px 12px;"for="">Gender</label>
        <select name="gender" id="gender">
<option value="">Male</option>
<option value="">Female</option>
        </select>
        </div>
        </div>
        <button style="color:black; background-color: greenyellow; border-radius: 6px; padding: 8px;">Register</button>
        </form>
        </div>
</body>
</html>
